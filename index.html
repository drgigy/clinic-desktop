<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinic Desktop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f4f8fa;
        --ink: #17222b;
        --muted: #627489;
        --line: #d9e4ea;
        --primary: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #edf4f6 0, var(--bg) 240px);
        color: var(--ink);
      }
      main {
        width: min(680px, calc(100vw - 32px));
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 44px rgba(16, 32, 43, .08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(34px, 6vw, 52px);
        line-height: 1;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.45;
      }
      .status {
        display: inline-flex;
        margin-bottom: 18px;
        border-radius: 999px;
        padding: 8px 12px;
        background: #e8f5f2;
        color: var(--primary);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: .04em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Desktop site</div>
      <h1>Clinic Desktop</h1>
      <p>The desktop version is ready for setup. The full clinic interface will be added here next.</p>
    </main>
  </body>
</html>
